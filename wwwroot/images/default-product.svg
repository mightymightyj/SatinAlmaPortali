<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Merkez Vurgu Dairesi -->
  <circle cx="300" cy="300" r="140" fill="url(#circleGrad)" />

  <!-- Minimalist 3D Ürün Kutusu (Tamamen Yazısız) -->
  <g transform="translate(300, 290)" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Üst Yüz -->
    <path d="M0 -75 L90 -25 L0 25 L-90 -25 Z" fill="url(#topFaceGrad)" />
    <!-- Sol Yüz -->
    <path d="M-90 -25 L0 25 L0 120 L-90 70 Z" fill="url(#leftFaceGrad)" />
    <!-- Sağ Yüz -->
    <path d="M90 -25 L0 25 L0 120 L90 70 Z" fill="url(#rightFaceGrad)" />
    <!-- İç Katlama Çizgisi -->
    <line x1="0" y1="25" x2="0" y2="120" stroke="#64748b" stroke-width="3" />
    <path d="M-45 -50 L45 0" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 5" fill="none" />
  </g>
</svg>
